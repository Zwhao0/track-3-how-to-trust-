[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scopeguard"
version = "0.1.0"
description = "Scope-aware safety guardrails for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scopeguard = "scopeguard.__main__:main"

[project.optional-dependencies]
codex = [
    "mcp>=1.26,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
