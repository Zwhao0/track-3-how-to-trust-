name: Offline verification

on:
  pull_request:
  push:
    branches: [feat/m5-benchmark, feat/m6-experiments, feat/m7-dashboard, feat/project-finalization, main, integration/m1-m4]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.16
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --offline --python ${{ matrix.python }} python -m pytest
      - run: uv run --locked --offline --python ${{ matrix.python }} scopeguard benchmark validate --manifest benchmarks/manifest.v0.1.json
      - run: uv run --locked --offline --python ${{ matrix.python }} scopeguard demo verify
      - run: uv run --locked --offline --python ${{ matrix.python }} scopeguard benchmark validate --prototype --manifest benchmarks/stress-v0.2/manifest.json
      - run: uv run --locked --offline --python ${{ matrix.python }} python docs/evidence/m6-formal/scopeguard-v01-f850fbfd20dd/verify-export.py
